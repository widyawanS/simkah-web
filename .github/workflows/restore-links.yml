name: Restore Internal Links

# Jalankan otomatis setiap hari jam 17:30 WIB (10:30 UTC)
# — tepat setelah jadwal publish harian (16:30 WIB) berlalu.
# Bisa juga dipicu manual dari tab Actions di GitHub.
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  restore:
    name: Pulihkan link internal ke artikel yang sudah tayang
    runs-on: ubuntu-latest
    permissions:
      contents: write   # agar bisa commit & push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan restore-links
        id: restore
        run: |
          node scripts/restore-links.mjs 2>&1 | tee restore-output.txt
          cat restore-output.txt

      - name: Commit perubahan (jika ada)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada link yang perlu dipulihkan hari ini."
          else
            RESTORED=$(grep -c "✅ DONE" restore-output.txt || true)
            git commit -m "Content: pulihkan ${RESTORED} link internal setelah artikel target tayang [skip ci]"
            git push
            echo "Push berhasil."
          fi
